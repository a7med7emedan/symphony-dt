name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=symphony_dt --cov-report=term-missing

  test-inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,inference]"
      - run: pytest

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Synthetic end-to-end run with parity check
        run: symphony-dt quickstart --workdir "$RUNNER_TEMP/qs" --n-patients 40

  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        inference: ["0", "1"]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg INFERENCE=${{ matrix.inference }} -t symphony-dt:ci .
      - name: CLI responds
        run: docker run --rm symphony-dt:ci --help
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id symphony-dt:ci -u)" != "0"
      - name: No data baked into the image
        run: |
          hits=$(docker run --rm --entrypoint sh symphony-dt:ci -c 'find /opt/symphony-dt /work /home \( -name "*.csv" -o -name "*.parquet" -o -name "*.zip" \) 2>/dev/null | wc -l')
          test "$hits" = "0"
      - name: Synthetic quickstart inside the container
        run: |
          mkdir -p "$RUNNER_TEMP/qs" && chmod 777 "$RUNNER_TEMP/qs"
          docker run --rm -v "$RUNNER_TEMP/qs:/work" symphony-dt:ci quickstart --workdir /work/run --n-patients 30
          ls "$RUNNER_TEMP/qs/run"
