name: Release

# Publishes to TestPyPI (release candidates) and PyPI (final releases) by trusted publishing.
# The GitHub release itself is created by the maintainer, not by a bot, with the SBOM artifact
# from the build job attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build, check and describe the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12"}
      - name: Gates
        run: |
          python tools/privacy_gate.py
          python tools/model_sha_gate.py
      - name: Version matches the tag
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/symphony_dt/_version.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "package $version, tag $tag"
          test "$version" = "$tag"
      - run: pip install build twine cyclonedx-bom
      - run: python -m build
      - run: twine check --strict dist/*
      - name: SBOM (CycloneDX)
        run: |
          python -m venv /tmp/sbom
          /tmp/sbom/bin/pip install dist/*.whl
          cyclonedx-py environment /tmp/sbom/bin/python --output-format JSON -o dist-sbom.cdx.json
      - name: Smoke test the wheel
        run: /tmp/sbom/bin/symphony-dt about
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with: {name: dist, path: dist/}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with: {name: sbom, path: dist-sbom.cdx.json}

  testpypi:
    name: Publish to TestPyPI (release candidates)
    if: contains(github.ref_name, 'rc')
    needs: build
    runs-on: ubuntu-latest
    environment: {name: testpypi, url: "https://test.pypi.org/p/symphony-dt"}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  pypi:
    name: Publish to PyPI (final releases)
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: build
    runs-on: ubuntu-latest
    environment: {name: pypi, url: "https://pypi.org/p/symphony-dt"}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          attestations: true
