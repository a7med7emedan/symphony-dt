name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_MKDOCS_2_WARNING: "1"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Coverage badge
        run: |
          pytest -q --cov --cov-report=json:cov.json
          python - <<'PY'
          import json
          pct = json.load(open("cov.json"))["totals"]["percent_covered"]
          colour = "brightgreen" if pct >= 90 else "yellow" if pct >= 80 else "red"
          json.dump({"schemaVersion": 1, "label": "coverage", "message": f"{pct:.0f}%", "color": colour},
                    open("docs/coverage-badge.json", "w"))
          PY
      - run: python tools/gen_docs_pages.py
      - run: mkdocs build --strict
      - run: cp docs/coverage-badge.json site/coverage-badge.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with: {path: site}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
