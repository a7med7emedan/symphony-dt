name: Slow suite

on:
  schedule:
    - cron: "17 3 * * 1"
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  NO_MKDOCS_2_WARNING: "1"
  CMDSTAN_VERSION: "2.39.0"

jobs:
  slow:
    name: Compile and fit pd_v2, execute the tutorials (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install CmdStan
        run: python -m cmdstanpy.install_cmdstan --version "$CMDSTAN_VERSION" --cores 4
      - name: Model-sha gate
        run: python tools/model_sha_gate.py
      - name: Slow suite
        run: pytest --run-slow tests/test_slow.py -v
      - name: Execute the tutorials
        run: |
          python -m ipykernel install --user --name symphony-dt
          cd docs/tutorials
          for nb in *.ipynb; do
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.kernel_name=symphony-dt \
              --ExecutePreprocessor.timeout=3600 --output "/tmp/executed-$nb" "$nb"
          done
