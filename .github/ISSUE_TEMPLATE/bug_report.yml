name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste participant data, identifiers or restricted results. Reproduce with simulate_cohort."
  - type: textarea
    id: what
    attributes: {label: What happened, description: "Include the command or code and the full error."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected}
  - type: input
    id: version
    attributes: {label: "Output of `symphony-dt about` and `symphony-dt check`"}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no participant data, identifiers or restricted results.
          required: true
