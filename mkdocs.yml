site_name: symphony-dt
site_description: Bayesian hierarchical state-space digital twins for longitudinal clinical cohorts.
site_author: Ahmed Hemedan
site_url: https://a7med7emedan.github.io/symphony-dt/
repo_url: https://github.com/a7med7emedan/symphony-dt
repo_name: a7med7emedan/symphony-dt
edit_uri: edit/main/docs/
copyright: Copyright 2026 Ahmed Hemedan. BSD-3-Clause.

theme:
  name: material
  logo: assets/brand/symphony-dt-mark-dark.svg
  favicon: assets/brand/favicon-32.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [navigation.sections, navigation.top, navigation.footer, content.code.copy, search.highlight]

extra_css: [stylesheets/extra.css]

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex: {generic: true}

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Concepts:
      - Digital twins: concepts/digital-twin.md
      - The state-space model: concepts/state-space-model.md
      - Uncertainty and calibration: concepts/uncertainty.md
      - Convergence gates: concepts/gates.md
      - Simulation-based calibration: concepts/sbc.md
      - Governance: concepts/governance.md
  - User guide:
      - The modeller's workflow: guide/workflow.md
      - The living twin: guide/twin.md
      - Running on any machine: guide/compute.md
      - Data: guide/data.md
      - Input and output: guide/io.md
      - Models: guide/models.md
      - Fitting and gates: guide/fit.md
      - Forecasting: guide/forecast.md
      - Evaluation: guide/evaluate.md
      - Calibration checks: guide/calibration.md
      - Governance and reports: guide/governance.md
      - Command line: guide/cli.md
  - Interoperability: interoperability.md
  - Tutorials:
      - 1. Simulate and validate: tutorials/01_simulate_and_validate.ipynb
      - 2. Fit, gates, forecast, evaluate: tutorials/02_fit_forecast_evaluate.ipynb
      - 3. Simulation-based calibration: tutorials/03_sbc.ipynb
      - 4. Governance and reports: tutorials/04_governance_and_report.ipynb
  - API reference:
      - symphony_dt.data: api/data.md
      - symphony_dt.io: api/io.md
      - symphony_dt.models: api/models.md
      - symphony_dt.fit: api/fit.md
      - symphony_dt.diagnostics: api/diagnostics.md
      - symphony_dt.forecast: api/forecast.md
      - symphony_dt.evaluate: api/evaluate.md
      - symphony_dt.calibration: api/calibration.md
      - symphony_dt.governance: api/governance.md
      - symphony_dt.twin: api/twin.md
      - Study, outputs, compute, bench: api/workflow.md
      - Reports, plots and CLI: api/other.md
  - Benchmark: benchmark.md
  - Roadmap: roadmap.md
  - Validation status: validation-status.md
  - Model card: model-card.md
  - Governance and data access: governance.md
  - FAQ: faq.md
  - Changelog: changelog.md
  - Citation: citation.md
  - Contributing: contributing.md
