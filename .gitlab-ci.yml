image: python:3.12-slim

stages:
  - lint
  - test

cache:
  paths:
    - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

lint:
  stage: lint
  script:
    - pip install "ruff>=0.4"
    - ruff check .

test:
  stage: test
  script:
    - python -V
    - pip install -U pip
    - pip install -e ".[dev]"
    - pytest
    - symphony-dt quickstart --workdir /tmp/qs --n-patients 40
