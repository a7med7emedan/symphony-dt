# Mirrors the lint and test jobs of .github/workflows/ci.yml. Docker builds run on GitHub only.
image: python:3.12-slim

stages:
  - lint
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  interruptible: true
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip

lint:
  stage: lint
  script:
    - pip install "ruff>=0.4"
    - ruff check .

test:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12"]
  script:
    - python -V
    - pip install -e ".[dev]"
    - pytest --cov=symphony_dt --cov-report=term-missing --cov-report=xml
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

quickstart:
  stage: test
  script:
    - pip install .
    - symphony-dt quickstart --workdir /tmp/qs --n-patients 40
