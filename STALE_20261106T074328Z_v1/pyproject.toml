[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony-dt"
version = "0.2.0"
description = "SYMPHONY: a clinic-updated Bayesian digital twin for Parkinson's disease progression (PPMI-shaped data)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ahmed Hemedan" }]
maintainers = [{ name = "Ahmed Hemedan" }]
keywords = [
  "digital twin",
  "parkinsons disease",
  "bayesian inference",
  "hierarchical model",
  "state space model",
  "stochastic dynamics",
  "latent state",
  "disease progression modelling",
  "personalised medicine",
  "nuts",
  "hamiltonian monte carlo",
  "numpyro",
  "jax",
  "posterior predictive",
  "uncertainty quantification",
  "calibration",
  "truncated likelihood",
  "clinical forecasting",
  "ppmi",
  "mds-updrs",
  "moca",
  "scopa-aut",
  "hpc",
  "slurm",
  "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Environment :: Console",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "typer>=0.9",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "build>=1.0",
  "twine>=5.0",
  "pre-commit>=3.5",
]

inference = [
  "numpyro>=0.13",
  "jax>=0.4",
  "jaxlib>=0.4",
]

[project.urls]
Homepage = "https://github.com/a7med7emedan/symphony-dt"
Documentation = "https://github.com/a7med7emedan/symphony-dt#readme"
Changelog = "https://github.com/a7med7emedan/symphony-dt/blob/main/CHANGELOG.md"
Source = "https://github.com/a7med7emedan/symphony-dt"
Issues = "https://github.com/a7med7emedan/symphony-dt/issues"

[project.scripts]
symphony-dt = "symphony_dt.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Correctness-focused set: undefined names, syntax errors, real bugs.
select = ["F", "E9", "PLW0127"]
ignore = ["F401"]
