name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Tag must match the version in pyproject.toml
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["VERSION"]
          heading = re.compile(r"^##\s+\[?v?" + re.escape(version) + r"\]?(\s|$)")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          body, found = [], False
          for line in lines:
              if found and line.startswith("## "):
                  break
              if found:
                  body.append(line)
              elif heading.match(line):
                  found = True
          notes = "\n".join(body).strip()
          if not found or not notes:
              sys.exit(f"::error::CHANGELOG.md has no non-empty '## {version}' section.")
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          print(notes)
          PY

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build

      - name: Check distributions
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=()
          if [[ "$VERSION" =~ (a|b|rc|dev)[0-9]*$ ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "symphony-dt $VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}"

  pypi:
    # Inert until the repository variable PUBLISH_PYPI is set to 'true' and a
    # trusted publisher for this workflow and the 'pypi' environment is set up on PyPI.
    if: vars.PUBLISH_PYPI == 'true'
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/symphony-dt/
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
