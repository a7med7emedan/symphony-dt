[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony-dt"
version = "0.2.0"
description = "SYMPHONY: a clinic-updated Bayesian digital twin for Parkinson's disease progression (PPMI-shaped data)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ahmed Hemedan" }]
keywords = ["digital twin", "parkinsons disease", "ppmi", "bayesian", "numpyro", "forecasting", "hpc", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "typer>=0.9",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
]

inference = [
  "numpyro>=0.13",
  "jax>=0.4",
  "jaxlib>=0.4",
]

[project.urls]
Homepage = "https://github.com/a7med7emedan/symphony-dt"
Issues = "https://github.com/a7med7emedan/symphony-dt/issues"

[project.scripts]
symphony-dt = "symphony_dt.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Correctness-focused set: undefined names, syntax errors, real bugs.
select = ["F", "E9", "PLW0127"]
ignore = ["F401"]
