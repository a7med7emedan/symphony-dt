[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "symphony-dt"
dynamic = ["version"]
description = "Bayesian hierarchical state-space digital twins for longitudinal clinical cohorts, with the SYMPHONY v2 Parkinson's disease model."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ahmed Hemedan" }]
maintainers = [{ name = "Ahmed Hemedan" }]
keywords = ["bayesian", "digital-twin", "parkinsons-disease", "stan", "state-space-model",
            "uncertainty-quantification", "clinical-prediction", "reproducibility"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "cmdstanpy>=1.2",
  "arviz>=0.18",
  "xarray>=2023.10",
  "matplotlib>=3.8",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
io = ["pyarrow>=14", "polars>=0.20", "openpyxl>=3.1", "h5netcdf>=1.3", "h5py>=3.10"]
test = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "properscoring>=0.1",
        "symphony-dt[io]"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25", "mkdocs-jupyter>=0.24",
        "nbconvert>=7", "ipykernel>=6"]
dev = ["symphony-dt[test,docs]", "ruff>=0.6", "mypy>=1.10", "pandas-stubs", "types-PyYAML",
       "pre-commit>=3.7", "build>=1.2", "twine>=5"]

[project.scripts]
symphony-dt = "symphony_dt.cli:main"

[project.urls]
Homepage = "https://a7med7emedan.github.io/symphony-dt/"
Documentation = "https://a7med7emedan.github.io/symphony-dt/"
Repository = "https://github.com/a7med7emedan/symphony-dt"
Issues = "https://github.com/a7med7emedan/symphony-dt/issues"
Changelog = "https://github.com/a7med7emedan/symphony-dt/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/symphony_dt/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/symphony_dt"]
exclude = ["**/*.hpp", "**/*.o"]

[tool.hatch.build.targets.sdist]
include = ["src/symphony_dt", "tests", "LICENSE", "README.md", "CHANGELOG.md", "CITATION.cff", "pyproject.toml"]
exclude = ["**/*.hpp", "**/*.o", "tests/**/__pycache__"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["STALE_*", "docs/tutorials"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "C4", "PT", "NPY", "PD"]
# UP031 and PD008: the scoring port keeps the code of record's formatting and indexing verbatim.
# N812 and N815: `constants as C` and the Stan switch name `ledd_in_mu_U` are deliberate.
ignore = ["N803", "N806", "N802", "RUF001", "RUF002", "RUF003", "PD011", "PD010", "B905",
          "UP031", "PD008", "N812", "N815", "UP042", "C416", "C401", "RUF046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N", "PD", "B018", "PT011", "PT018", "RUF059", "E501", "SIM117"]
"tests/golden/stubs/**" = ["ALL"]
"tools/make_logo.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src/symphony_dt"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cmdstanpy.*", "arviz.*", "scipy.*", "properscoring.*", "polars.*", "pyarrow.*", "xarray.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: compiles Stan and fits a model; run with --run-slow",
  "golden: compares the package with the code of record",
]
filterwarnings = ["error::symphony_dt.errors.SymphonyWarning", "ignore::SyntaxWarning:properscoring"]

[tool.coverage.run]
source = ["symphony_dt"]
branch = true
omit = ["*/symphony_dt/fit.py", "*/symphony_dt/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
