[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony-dt"
version = "0.1.0"
description = "SYMPHONY clinic-updated digital twin (PPMI) — production pipeline package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SYMPHONY" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "typer>=0.9",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

inference = [
  "numpyro>=0.13",
  "jax>=0.4",
  "jaxlib>=0.4",
]

[project.scripts]
symphony-dt = "symphony_dt.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
